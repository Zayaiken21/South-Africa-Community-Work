name: Refresh job listings

# Pulls online and in-person South African jobs into data/jobs-feed.json.
# GitHub Pages redeploys automatically after each commit.
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/fetch-jobs-feed.mjs
      - .github/workflows/refresh-jobs.yml

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch job sources
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scripts/fetch-jobs-feed.mjs
      - name: Commit updated listings
        run: |
          if git diff --quiet -- data/jobs-feed.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs-feed.json
          git commit -m "Refresh job listings"
          git pull --rebase --autostash origin main
          git push
