<!doctype html><html lang="en-ZA"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0e1613" media="(prefers-color-scheme: dark)"><title>Help and support | Community Work South Africa</title><meta name="description" content="Ask Randy, our support assistant, read common questions and staying-safe tips, or contact the Community Work team."><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://zayaiken21.github.io/South-Africa-Community-Work/support.html"><link rel="alternate" hreflang="en-ZA" href="https://zayaiken21.github.io/South-Africa-Community-Work/help.html"><link rel="alternate" hreflang="x-default" href="https://zayaiken21.github.io/South-Africa-Community-Work/help.html"><link rel="sitemap" type="application/xml" href="./sitemap.xml"><meta name="geo.region" content="ZA"><meta name="format-detection" content="telephone=no"><meta property="og:site_name" content="Community Work South Africa"><meta property="og:locale" content="en_ZA"><meta property="og:type" content="website"><meta property="og:title" content="Help and support | Community Work South Africa"><meta property="og:description" content="Ask Randy, our support assistant, read common questions and staying-safe tips, or contact the Community Work team."><meta property="og:url" content="https://zayaiken21.github.io/South-Africa-Community-Work/help.html"><meta property="og:image" content="https://zayaiken21.github.io/South-Africa-Community-Work/assets/icons/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Community Work South Africa"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Help and support | Community Work South Africa"><meta name="twitter:description" content="Ask Randy, our support assistant, read common questions and staying-safe tips, or contact the Community Work team."><meta name="twitter:image" content="https://zayaiken21.github.io/South-Africa-Community-Work/assets/icons/og-image.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="./assets/icons/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Community Work"><meta name="application-name" content="Community Work"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="./assets/community-app.css?v=ce23828aa3"></head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:24px;font-family:sans-serif;line-height:1.6"><h1>Help and support</h1><p>Ask Randy, our support assistant, read common questions and staying-safe tips, or contact the Community Work team.</p><h2>Common questions</h2><h3>What is Community Work?</h3><p>Community Work connects people in South Africa with paid work. Workers pick up paid shifts near them and get paid per hour. Businesses post shifts, book workers and pay safely through escrow. There are also in-person jobs from employers across SA and online jobs you can do from home.</p><h3>Is it free?</h3><p>It’s free for workers — you never pay to find or pick up work, and you receive the full hourly rate. Businesses pay a 10% service fee on escrow shifts, on top of what they pay the worker. Cash shifts have no fee.</p><h3>How do I get a shift?</h3><p>Open Shifts, choose your area and distance, and tap Pick up on a shift you want. You’re booked straight away — no waiting to be chosen. You’ll then see the exact address and the business’s phone number under Account → My shifts.</p><h3>Why cant I see shifts?</h3><p>Shifts disappear when all spots are taken, and come back if someone cancels. Try a bigger distance. You also won’t see shifts from a business that released or blocked you, your own business’s shifts, or any shifts while your account is paused or in Hiring mode.</p><h3>How do I cancel a shift?</h3><p>Go to Account → My shifts → Cancel shift. Cancelling within 10 minutes of picking it up is free. After that it counts as a strike — 3 strikes pauses your account until an appeal is approved. Please cancel as early as possible so the business can find someone else.</p><h3>What is a strike?</h3><p>You get a strike when you cancel a shift you picked up (after the free 10-minute window) or don’t show up. At 3 strikes your account is paused until our team approves an appeal; the count then starts again. A business releasing you is never a strike.</p><h3>My account is paused?</h3><p>Open your Account page — when it’s paused you’ll see a form to send an appeal. Explain what happened (for example illness or transport problems) and what you’ll do differently. Our team reviews every appeal and replies on the same page. Permanently closed accounts can’t appeal.</p><h3>Business released me?</h3><p>A business can release you before a shift starts (for example if plans change). It is not a strike against you, and any escrow money goes back to the business. You can’t re-book that same shift, but every other shift is still open to you.</p><h3>Marked as no show?</h3><p>If a business marks you as a no-show, it counts as a strike. If you did work the shift or it was a mistake, talk to a person straight away with the details (time you arrived, who you spoke to). We check with the business and remove wrong strikes.</p><h3>Confirm my hours?</h3><p>After the shift the business records the hours. You’ll see Confirm X hours under My shifts — tap it if it’s right. If it’s wrong, don’t confirm: tap Report a problem or talk to a person, and the money stays held until it’s sorted.</p><h3>What should I bring?</h3><p>Check the shift description for dress code and what to bring, and arrive 10–15 minutes early. The exact address and the business’s phone number are under Account → My shifts once you’re booked. Running late? Phone the business straight away.</p><h3>Can I book two shifts?</h3><p>You can book as many shifts as you like, as long as they don’t overlap in time. We stop double-bookings automatically.</p><h3>When do I get paid?</h3><p>For escrow shifts, the business pays into escrow when you’re booked. After the shift, the business confirms your hours and releases the pay, and it goes straight to your bank account — usually within a few working days, depending on your bank. Cash shifts are paid by the business in person. Check Account → My shifts for each shift’s pay status.</p><h3>What is escrow?</h3><p>Escrow means the business pays the shift money before you work, and an independent South African escrow company (TradeSafe) holds it — not Community Work and not the business. It’s released to the worker once the hours are confirmed. If there’s a problem, the money stays held until it’s resolved.</p><h3>Add my bank account?</h3><p>Go to Account → Get paid (in Working mode) and add your name as on your ID, SA ID number, mobile number and bank account. These go to TradeSafe to meet South African FICA rules; we only keep the last four digits.</p><h3>Can I be paid with paypal?</h3><p>Escrow pay goes to a South African bank account — that’s how licensed escrow works here. Cash App isn’t available in South Africa, and PayPal or Wise can’t hold escrow. If you and the business agree, a shift can be paid in cash instead.</p><h3>What is the service fee?</h3><p>Businesses pay the worker’s full hourly rate plus a 10% service fee on escrow shifts. Workers never pay a fee. Cash shifts have no fee.</p><h3>Problem with my pay?</h3><p>On the shift, tap Report a problem. The money stays held in escrow while our team looks at what happened (hours, messages, both sides’ explanation) and then releases it to the worker or refunds the business. You can also talk to a person here.</p><h3>How do refunds work?</h3><p>If a worker cancels, doesn’t show up, or you release them, the escrow payment for that booking is refunded to the business. If you paid but the shift was cancelled before it started, it’s refunded too. Refunds go back through TradeSafe to how you paid.</p><h3>How do cash shifts work?</h3><p>On cash shifts the business pays the worker in person at the end of the shift, then taps Mark paid in cash so it’s recorded. We can’t recover unpaid cash, so for bigger shifts we recommend escrow.</p><h3>Minimum wage?</h3><p>Every shift pays at least the national minimum wage: R30.23 an hour (from 1 March 2026). Shifts are at least 4 hours, because by law anyone who works less than 4 hours in a day must be paid for 4.</p><h3>Overtime pay?</h3><p>South African law (BCEA) for most employees: overtime is paid at 1.5×, Sunday work at 2× (1.5× if you normally work Sundays), public holidays at 2×, and night work (18:00–06:00) needs an allowance or shorter hours plus transport. Businesses must include these in the hourly rate they set for such shifts.</p><h3>How do I post a shift?</h3><p>Switch to Hiring mode, open Post a shift, add the title, what the worker will do, the workplace location, date, start and end time (4–12 hours) and pay per hour (at least R30.23). Choose escrow or cash, then post. Nearby workers can pick it up straight away.</p><h3>How do I pay a worker?</h3><p>When a worker picks up your escrow shift, tap Pay into escrow on that booking (under Shifts). You’ll pay securely through TradeSafe. The first time, TradeSafe asks for your name, ID number and mobile (FICA). After the shift, record the hours and tap Release pay.</p><h3>Release pay?</h3><p>After the shift starts, tap Record hours on the worker, enter the hours worked, then tap Release pay. If fewer hours were worked than booked, our team releases the right amount and refunds the rest.</p><h3>Remove a worker?</h3><p>Before the shift starts, tap Release worker on their booking. The spot opens for others and any escrow payment is refunded to you. Releasing isn’t a strike against the worker. Please only release for a real reason and as early as possible.</p><h3>Block a worker?</h3><p>Tap Block on the worker in your Shifts list, or Block from my shifts on their profile. They won’t see or book any of your shifts again. Manage blocks under Account → Settings → Blocked workers, where you can unblock them.</p><h3>Worker did not show up?</h3><p>After the start time, tap No-show on the worker. It counts as a strike on their account and any escrow payment is refunded to you. Only mark a no-show if they really didn’t come — false no-shows can lead to your account being reviewed.</p><h3>Delete a shift?</h3><p>Under Shifts, tap Delete shift on any shift nobody has worked or been paid for. It’s removed completely. If a worker is booked, release them first (you’ll be refunded), then delete.</p><h3>Am I the employer?</h3><p>The business that books the worker is their employer for that shift and is responsible for lawful pay, a safe workplace, and — where they apply — UIF, COIDA and PAYE. Workers who work 24 hours or more in a month for you must be registered for UIF. Community Work is a marketplace and doesn’t employ the workers.</p><p>Turn on JavaScript to search jobs, pick up shifts and hire workers.</p><nav aria-label="Pages"><ul><li><a href="./index.html">Find work close to home</a></li><li><a href="./find-work.html">Find jobs near you and online</a></li><li><a href="./post-job.html">Hire workers by the shift</a></li><li><a href="./shifts.html">Paid shifts near you</a></li><li><a href="./account.html">Your account</a></li><li><a href="./support.html">Support</a></li><li><a href="./rules.html">Community rules</a></li><li><a href="./how-it-works.html">How it works</a></li><li><a href="./about.html">About Community Work</a></li><li><a href="./privacy.html">Privacy information</a></li><li><a href="./terms.html">Platform terms</a></li><li><a href="./cv-builder.html">CV builder</a></li></ul></nav></main></noscript><script type="module" src="./assets/community-app.js?v=ce23828aa3"></script></body></html>
